# Builds and target tooling run in Docker; host-side helper scripts use mise's python/uv.

[tools]
python = "3.14"
shellcheck = "latest"
uv = "latest"

[env]
# Default write target of tools and tasks (throwaway; see assets/scratch/README.md).
SCRATCH = "{{config_root}}/assets/scratch"

[settings]
env_shell_expand = false

[tasks."docker:build-images"]
description = "Build both Docker images (qemu-ipod-dev, qemu-ipod-build)"
depends = ["docker:build-dev-image", "docker:build-build-image"]

# Task definitions live in scripts/ as file tasks (nested directories are groups, e.g.
# scripts/ipod/run -> ipod:run). Run `mise tasks` for the full list.
[task_config]
includes = ["scripts"]

[tasks.check]
description = "Run every check:* task"
depends = ["check:*"]
